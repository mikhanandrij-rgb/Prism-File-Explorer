name: Dependency report

on:
  workflow_dispatch:
  push:
    paths:
      - 'gradle/libs.versions.toml'
      - 'scripts/deps_report.py'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/deps_report.py | tee -a "$GITHUB_STEP_SUMMARY"
