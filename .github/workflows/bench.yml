name: Upscaler benchmark

# Runs only UpscalerBenchmarkTest, for commits whose message contains [bench].
# Options to render: scripts/bench_only.txt (ids separated by ":"; empty = all).
on:
  push:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    if: contains(github.event.head_commit.message, '[bench]')
    name: Upscaler benchmark (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build app and test APKs
        run: ./gradlew --console=plain assembleDebug assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run benchmark
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -no-boot-anim -camera-back none -camera-front none -skin 540x1200
          script: bash scripts/run_benchmark.sh

      - name: Annotate results
        if: always()
        run: |
          [ -f shader-test/bench/results.txt ] && python3 scripts/ci_annotate.py notice shader-test/bench/results.txt upscaler-bench
          [ -f connected.log ] && grep -E "FAILED|Exception|Error" connected.log | head -40 > fail.txt && [ -s fail.txt ] && python3 scripts/ci_annotate.py notice fail.txt failures
          true

      - name: Publish screenshots to the bench-artifacts branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shader-test ] || exit 0
          mkdir -p publish && cp -r shader-test publish/
          [ -f logcat.txt ] && gzip -c logcat.txt > publish/logcat.txt.gz
          cd publish
          printf 'Benchmark from %s (%s)\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > README.txt
          git init -q && git checkout -q -b bench-artifacts && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "bench $GITHUB_SHA"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bench-artifacts
