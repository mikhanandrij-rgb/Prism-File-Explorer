name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --stacktrace testDebugUnitTest 2>&1 | tee test.log

      - name: Annotate errors
        if: failure()
        run: |
          [ -f test.log ] && python3 scripts/ci_annotate.py errors test.log
          [ -f build.log ] && python3 scripts/ci_annotate.py errors build.log
          true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/'

  instrumented:
    name: Instrumented tests (emulator API 34)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none
          script: bash -c 'set -o pipefail; ./gradlew --stacktrace :app:connectedDebugAndroidTest 2>&1 | tee connected.log'

      - name: Annotate results
        if: always()
        run: |
          [ "${{ job.status }}" != "success" ] && [ -f connected.log ] && python3 scripts/ci_annotate.py errors connected.log
          for f in app/build/outputs/androidTest-results/connected/debug/*.xml app/build/outputs/androidTest-results/connected/*/*.xml; do
            [ -f "$f" ] && python3 scripts/ci_annotate.py notice "$f" junit-xml
          done
          true

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
