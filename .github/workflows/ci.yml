name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          # Own timeout so a hang still fails the step and gets annotated below.
          timeout 30m ./gradlew --stacktrace --console=plain assembleDebug 2>&1 | tee build.log

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --stacktrace testDebugUnitTest 2>&1 | tee test.log

      - name: Annotate errors
        if: failure()
        run: |
          [ -f test.log ] && python3 scripts/ci_annotate.py errors test.log
          [ -f build.log ] && python3 scripts/ci_annotate.py errors build.log
          [ -f build.log ] && tail -n 60 build.log > build-tail.log && python3 scripts/ci_annotate.py notice build-tail.log build-tail
          true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish nightly APK to Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          mkdir -p dist
          for apk in app/build/outputs/apk/debug/*.apk; do
            abi=$(basename "$apk" .apk | sed -E 's/^app-(.*)-debug$/\1/')
            cp "$apk" "dist/facet-files-nightly-$SHORT-$abi.apk"
          done
          ls -la dist
          NOTES="Automatic debug build of $SHORT: $(git log -1 --format=%s)

          Which file to download:
          - arm64-v8a: almost every phone from the last 8 years
          - armeabi-v7a: old 32-bit phones
          - x86_64 / x86: emulators and Chromebooks

          Installs next to the release version (package io.github.mikhanandrij_rgb.facet.debug)."
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly dist/*.apk \
            --prerelease --title "Nightly ($SHORT)" --notes "$NOTES" --target "$GITHUB_SHA"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/'

  instrumented:
    name: Instrumented tests (emulator API 34)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none -skin 540x1200
          script: bash scripts/run_connected_tests.sh

      - name: Annotate results
        if: always()
        run: |
          [ "${{ job.status }}" != "success" ] && [ -f connected.log ] && python3 scripts/ci_annotate.py errors connected.log
          if [ -f logcat.txt ]; then
            grep -E " mpv *:|libmpv|AndroidRuntime|FATAL|ANR in|TestRunner: (started|failed|finished)|TestTimedOut|DEBUG  :|libEGL|swiftshader" logcat.txt \
              | grep -v THREAD_STATE | head -n 400 > logcat-filtered.txt || true
            python3 scripts/ci_annotate.py notice logcat-filtered.txt logcat
          fi
          for f in app/build/outputs/androidTest-results/connected/debug/*.xml app/build/outputs/androidTest-results/connected/*/*.xml; do
            [ -f "$f" ] && python3 scripts/ci_annotate.py notice "$f" junit-xml
          done
          true

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            logcat.txt
